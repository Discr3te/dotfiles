[main]
output=<focused>
exit-on-keyboard-focus-loss=no
font=JetBrainsMono Nerd Font:size=17
lines=10
width=40
tabs=4
horizontal-pad=24
vertical-pad=16
inner-pad=10
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=alacritty -e  # Replace with your preferred terminal
list-executables-in-path=yes

[border]
width=2
radius=10

[dmenu]
mode=index
exit-immediately-if-empty=no

[key-bindings]
prev=Up Control+k
next=Down Control+j
cursor-left=Control+h Left
cursor-right=Control+l Right
delete-prev=BackSpace
delete-line-forward=none
